# Baza H2 w pamięci, w trybie zgodności z PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop

# Klucz JWT do testów
jwt.secret=jwt-test-only-do-not-use-in-production-0123456789abcdef0123456789abcdef

# Klucz Turnstile do testów. Testy nie łączą się z Cloudflare: sprawdzanie tokenów zastępuje atrapa
turnstile.secret-key=turnstile-test-only-secret-key