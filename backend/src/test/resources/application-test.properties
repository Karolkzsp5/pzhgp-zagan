# Osobna baza PostgreSQL tylko dla testów, np. pzhgp_zagan_test na tym samym serwerze co baza aplikacji.
# Hibernate tworzy w niej tabele przy starcie testów i usuwa je na końcu, więc baza z danymi zostaje nietknięta.
# Nazwa bazy musi kończyć się na "_test", inaczej testy się nie uruchomią (sprawdza to TestDatabaseGuard).
# Login i hasło są domyślnie takie same jak do bazy aplikacji (DB_USERNAME i DB_PASSWORD z pliku .env).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/pzhgp_zagan_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=create-drop

# Klucz JWT do testów
jwt.secret=jwt-test-only-do-not-use-in-production-0123456789abcdef0123456789abcdef

# Klucz Turnstile do testów. Testy nie łączą się z Cloudflare: sprawdzanie tokenów zastępuje atrapa
turnstile.secret-key=turnstile-test-only-secret-key
