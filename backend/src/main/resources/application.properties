spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Services map entities to DTOs inside their transactions, so no lazy loading is needed later
spring.jpa.open-in-view=false

# Users are authenticated with JWT; Spring Boot should not create a default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT key from an environment variable
jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Secure flag of the authentication cookie: true in production (HTTPS)
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Behind a reverse proxy (e.g. nginx) set FORWARD_HEADERS_STRATEGY=native,
# so rate limits see the client's address instead of the proxy's address
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Health check for monitoring: GET /actuator/health returns only the overall status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Global file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
