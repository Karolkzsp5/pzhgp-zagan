spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

# Połączenie z bazą danych
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Serwisy zamieniają encje na DTO wewnątrz transakcji, więc później nic nie jest doładowywane
spring.jpa.open-in-view=false

# Logowanie działa przez JWT, więc Spring Boot nie tworzy domyślnego użytkownika w pamięci
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Klucz JWT ze zmiennej środowiskowej
jwt.secret=${JWT_SECRET}

# Adres frontendu, z którego przeglądarka może wysyłać zapytania (CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Flaga Secure ciasteczka z tokenem: na produkcji (HTTPS) ustaw true
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Za reverse proxy (np. nginx) ustaw FORWARD_HEADERS_STRATEGY=native,
# żeby limity zapytań widziały adres klienta, a nie adres proxy
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Stan aplikacji do monitoringu: GET /actuator/health zwraca tylko ogólny status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Limity rozmiaru przesyłanych plików
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
