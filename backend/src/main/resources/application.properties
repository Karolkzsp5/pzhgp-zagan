spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

# Połączenie z bazą danych
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Serwisy zamieniają encje na DTO wewnątrz transakcji, więc później nic nie jest doładowywane
spring.jpa.open-in-view=false

# Logowanie działa przez JWT, więc Spring Boot nie tworzy domyślnego użytkownika w pamięci
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Klucz JWT ze zmiennej środowiskowej
jwt.secret=${JWT_SECRET}

# Adres frontendu, z którego przeglądarka może wysyłać zapytania (CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Flaga Secure ciasteczka z tokenem: na produkcji (HTTPS) ustaw true
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Za reverse proxy (np. nginx) ustaw FORWARD_HEADERS_STRATEGY=native,
# żeby limity zapytań widziały adres klienta, a nie adres proxy
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Cloudflare Turnstile (CAPTCHA) w formularzach rejestracji i zgłoszenia znalezionego gołębia.
# Klucz tajny służy do sprawdzania tokenów w API Cloudflare i nie trafia do frontendu
turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify

# Limity czasu zapytań do zewnętrznych API, żeby awaria Cloudflare nie blokowała obsługi formularzy
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=5s

# Wysyłka e-maili (link do zmiany hasła) przez serwer SMTP.
# Domyślne wartości pasują do lokalnego serwera testowego (np. Mailpit), który nie wymaga logowania
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:no-reply@pzhgp-zagan.local}

# Adres frontendu wstawiany do linków w wiadomościach e-mail
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Stan aplikacji do monitoringu: GET /actuator/health zwraca tylko ogólny status.
# Dostępność serwera pocztowego nie wpływa na ten status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Limity rozmiaru przesyłanych plików
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
