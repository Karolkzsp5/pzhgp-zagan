# Cała aplikacja w kontenerach: baza PostgreSQL, backend, frontend i Mailpit (podgląd wysłanych e-maili).
# Uruchomienie z głównego katalogu projektu: docker compose up --build
# Wcześniej skopiuj .env.example do .env i uzupełnij hasło bazy oraz klucz JWT.

name: pzhgp-zagan

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: pzhgp_zagan
      POSTGRES_USER: pzhgp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
    volumes:
      # Dane bazy przetrwają zatrzymanie i usunięcie kontenerów (usuwa je dopiero docker compose down -v)
      - db-data:/var/lib/postgresql
      # Kopia danych w formacie SQL z katalogu docker/db-import jest wczytywana tylko przy pierwszym starcie pustej bazy
      - ./docker/db-import:/docker-entrypoint-initdb.d:ro
    ports:
      # Dostęp z pgAdmin na komputerze: localhost:5433 (5432 zajmuje zwykle lokalny PostgreSQL)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pzhgp -d pzhgp_zagan"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      # Skrzynka z wiadomościami wysłanymi przez aplikację: http://localhost:8025
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/pzhgp_zagan
      DB_USERNAME: pzhgp
      DB_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      TZ: Europe/Warsaw
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Adres backendu widziany z przeglądarki (wbudowywany w aplikację przy budowaniu obrazu)
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data:
